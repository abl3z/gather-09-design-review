<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1680" viewBox="0 0 1280 1680" role="img" aria-label="No-results recovery">
<title>No-results recovery</title>
<rect id="background" width="1280" height="1680" fill="#f5f7f3"/>
<g id="header">
<text x="40" y="48" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#1f6f58">GATHER · SUPPLEMENTAL FLOW 02 OF 03</text>
<text x="40" y="84" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#0d1816">No-results recovery</text>
<text x="40" y="108" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#54665d">Restrictive filters return nothing. The user always has a next step, and no counts are promised.</text>
</g>
