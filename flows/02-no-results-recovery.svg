<text id="footer" x="40" y="1648" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#54665d">Fictional test content. Scarcity counts, saved card and payment results are invented for this assignment.</text>
